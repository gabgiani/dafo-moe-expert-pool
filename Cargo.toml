[package]
name = "dafo-compiler-llm"
version = "0.1.0"
edition = "2024"
publish = false
description = "A compiler for language models: turns a GGUF model into a fixed plan of GPU dispatches for the chip it runs on (Metal first, Gemma 4 first)."
license = "MIT"
readme = "README.md"
keywords = ["llm", "compiler", "metal", "gguf", "inference"]
categories = ["science", "hardware-support"]

[features]
# The host: tokenizer, chat template, sampling, tools and an OpenAI-compatible server (`dafo-serve`). The compiler itself needs none of it.
host = ["dep:tokenizers", "dep:serde_json", "dep:tiny_http"]

[[bin]]
name = "dafo-serve"
path = "src/bin/dafo-serve.rs"
required-features = ["host"]

[dependencies]
anyhow = "1.0"
memmap2 = "0.9"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"], optional = true }
serde_json = { version = "1.0", optional = true }
tiny_http = { version = "0.12", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"

[profile.release]
debug = 1
